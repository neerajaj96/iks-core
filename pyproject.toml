[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iks-core"
version = "2.9.0"
description = "Indian Knowledge System Mathematical Abstraction Model — computational engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["iks_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
